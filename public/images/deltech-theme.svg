<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <linearGradient id="tech-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="45%" stop-color="#041f1a"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="tech-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="rgba(45,212,191,0.06)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="400" fill="url(#tech-bg)"/>
  <rect width="800" height="400" fill="url(#tech-grid)"/>

  <!-- Glowing Halos -->
  <circle cx="260" cy="190" r="170" fill="#14b8a6" opacity="0.18" filter="blur(45px)"/>
  <circle cx="630" cy="180" r="180" fill="#0284c7" opacity="0.2" filter="blur(50px)"/>

  <!-- Circuit Traces & Nodes -->
  <g stroke="url(#cyan-glow)" stroke-width="2.5" fill="none" opacity="0.65">
    <path d="M 0 100 H 160 L 210 150 V 260 L 260 310 H 420"/>
    <path d="M 80 380 H 220 L 270 330 H 480 L 540 270 H 800"/>
    <path d="M 580 0 V 90 L 530 140 H 400"/>
    <circle cx="160" cy="100" r="5" fill="#2dd4bf"/>
    <circle cx="210" cy="150" r="4" fill="#2dd4bf"/>
    <circle cx="260" cy="310" r="6" fill="#38bdf8"/>
    <circle cx="420" cy="310" r="5" fill="#2dd4bf"/>
    <circle cx="540" cy="270" r="6" fill="#38bdf8"/>
    <circle cx="580" cy="90" r="5" fill="#2dd4bf"/>
  </g>

  <!-- Code Editor Window (Center-Left) -->
  <g transform="translate(100, 75)">
    <!-- Window Frame -->
    <rect width="360" height="220" rx="14" fill="#06121e" stroke="rgba(45,212,191,0.4)" stroke-width="2"/>
    <!-- Controls -->
    <circle cx="25" cy="22" r="5" fill="#ef4444"/>
    <circle cx="42" cy="22" r="5" fill="#f59e0b"/>
    <circle cx="59" cy="22" r="5" fill="#10b981"/>
    <line x1="0" y1="42" x2="360" y2="42" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

    <!-- Code Syntax -->
    <g font-family="Consolas, Monaco, monospace" font-size="13" font-weight="bold">
      <text x="25" y="75" fill="#38bdf8">const</text>
      <text x="70" y="75" fill="#f8fafc"> delTech = </text>
      <text x="155" y="75" fill="#2dd4bf">async</text>
      <text x="205" y="75" fill="#f8fafc"> () =&gt; {</text>

      <text x="45" y="105" fill="#fbbf24">await</text>
      <text x="90" y="105" fill="#cbd5e1"> buildSolution({</text>

      <text x="65" y="135" fill="#93c5fd">category:</text>
      <text x="140" y="135" fill="#86efac">"Competitive AI"</text>
      <text x="260" y="135" fill="#f8fafc">,</text>

      <text x="65" y="165" fill="#93c5fd">impact:</text>
      <text x="125" y="165" fill="#f472b6">"National Finalist"</text>

      <text x="45" y="195" fill="#cbd5e1">});</text>
      <text x="25" y="215" fill="#f8fafc">};</text>
    </g>
  </g>

  <!-- Giant Glowing Tech Brackets & Binary Data (Right) -->
  <g transform="translate(600, 180)">
    <circle cx="0" cy="0" r="95" fill="none" stroke="rgba(45,212,191,0.3)" stroke-width="2" stroke-dasharray="10,8"/>
    <circle cx="0" cy="0" r="75" fill="none" stroke="rgba(56,189,248,0.2)" stroke-width="1.5"/>
    <text x="-65" y="32" font-family="monospace" font-size="88" font-weight="900" fill="#2dd4bf" opacity="0.95">&lt;/&gt;</text>
  </g>

  <!-- Binary floating code -->
  <g font-family="monospace" font-size="12" fill="rgba(45,212,191,0.35)" font-weight="bold">
    <text x="500" y="65">01000100 01000101 01001100</text>
    <text x="480" y="320">01010100 01000101 01000011 01001000</text>
  </g>
</svg>