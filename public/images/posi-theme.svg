<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <linearGradient id="posi-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="45%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- 3D Gold Trophy & Medal Gradient -->
    <linearGradient id="gold-bright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="90%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <linearGradient id="ribbon-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <linearGradient id="flask-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Halftone / Dot Matrix Pattern -->
    <pattern id="dot-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1.2" fill="rgba(255,255,255,0.08)"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="400" fill="url(#posi-bg)"/>
  <rect width="800" height="400" fill="url(#dot-grid)"/>

  <!-- Radiant Victory Aura -->
  <circle cx="620" cy="180" r="170" fill="#f59e0b" opacity="0.22" filter="blur(45px)"/>
  <circle cx="200" cy="180" r="140" fill="#38bdf8" opacity="0.18" filter="blur(40px)"/>

  <!-- Molecular Structure / Science Constellation Lines (Left) -->
  <g stroke="rgba(255,255,255,0.3)" stroke-width="2">
    <line x1="80" y1="120" x2="160" y2="70"/>
    <line x1="160" y1="70" x2="250" y2="110"/>
    <line x1="250" y1="110" x2="230" y2="200"/>
    <line x1="230" y1="200" x2="130" y2="220"/>
    <line x1="130" y1="220" x2="80" y2="120"/>
    <line x1="250" y1="110" x2="350" y2="70"/>
    <line x1="350" y1="70" x2="420" y2="130"/>

    <circle cx="80" cy="120" r="6" fill="#38bdf8"/>
    <circle cx="160" cy="70" r="8" fill="#facc15"/>
    <circle cx="250" cy="110" r="7" fill="#a855f7"/>
    <circle cx="230" cy="200" r="6" fill="#34d399"/>
    <circle cx="130" cy="220" r="7" fill="#f43f5e"/>
    <circle cx="350" cy="70" r="6" fill="#60a5fa"/>
    <circle cx="420" cy="130" r="6" fill="#fbbf24"/>
  </g>

  <!-- Laboratory Science Flask (Center-Left) -->
  <g transform="translate(190, 150)">
    <!-- Flask Glass Outline -->
    <path d="M 0 -50 L 22 -50 L 22 -15 L 65 65 A 14 14 0 0 1 52 85 L -30 85 A 14 14 0 0 1 -43 65 L 0 -15 Z" 
          fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="3"/>
    <!-- Liquid Content -->
    <path d="M -16 35 Q 12 25 44 35 L 52 85 L -30 85 Z" fill="url(#flask-blue)"/>
    <!-- Rising Bubbles -->
    <circle cx="5" cy="55" r="4.5" fill="#fff" opacity="0.8"/>
    <circle cx="22" cy="70" r="3.5" fill="#fff" opacity="0.8"/>
    <circle cx="-6" cy="65" r="3" fill="#fff" opacity="0.8"/>
  </g>

  <!-- GRAND OLYMPIC GOLD MEDAL & LAUREL WREATH (Right side) -->
  <g transform="translate(620, 180)">
    <!-- Ribbons (Red, White, Blue - National Olympiad styling) -->
    <polygon points="-35,-190 -55,-60 -15,-60" fill="url(#ribbon-grad)"/>
    <polygon points="35,-190 55,-60 15,-60" fill="#2563eb"/>
    <polygon points="-15,-190 15,-190 0,-60" fill="#f8fafc"/>

    <!-- Glowing Outer Laurel Branches (Wreath) -->
    <g stroke="#f59e0b" stroke-width="3" fill="#fbbf24" opacity="0.85">
      <!-- Left Leaves -->
      <path d="M -75,40 C -85,15 -85,-20 -70,-50 C -55,-75 -25,-100 0,-105" fill="none" stroke-width="3.5"/>
      <ellipse cx="-72" cy="20" rx="9" ry="5" transform="rotate(-30 -72 20)"/>
      <ellipse cx="-80" cy="-5" rx="9" ry="5" transform="rotate(-15 -80 -5)"/>
      <ellipse cx="-75" cy="-35" rx="9" ry="5" transform="rotate(10 -75 -35)"/>
      <ellipse cx="-58" cy="-65" rx="9" ry="5" transform="rotate(35 -58 -65)"/>
      <ellipse cx="-32" cy="-90" rx="9" ry="5" transform="rotate(60 -32 -90)"/>

      <!-- Right Leaves -->
      <path d="M 75,40 C 85,15 85,-20 70,-50 C 55,-75 25,-100 0,-105" fill="none" stroke-width="3.5"/>
      <ellipse cx="72" cy="20" rx="9" ry="5" transform="rotate(30 72 20)"/>
      <ellipse cx="80" cy="-5" rx="9" ry="5" transform="rotate(15 80 -5)"/>
      <ellipse cx="75" cy="-35" rx="9" ry="5" transform="rotate(-10 75 -35)"/>
      <ellipse cx="58" cy="-65" rx="9" ry="5" transform="rotate(-35 58 -65)"/>
      <ellipse cx="32" cy="-90" rx="9" ry="5" transform="rotate(-60 32 -90)"/>
    </g>

    <!-- Big Gold Medal Outer Ring -->
    <circle cx="0" cy="15" r="72" fill="url(#gold-bright)" stroke="#fef08a" stroke-width="4"/>
    <circle cx="0" cy="15" r="62" fill="none" stroke="#78350f" stroke-width="2.5" opacity="0.45"/>
    <circle cx="0" cy="15" r="58" fill="#d97706" opacity="0.15"/>

    <!-- 5-Pointed Olympiad Star Motif inside Medal -->
    <polygon points="0,-15 11,10 36,13 18,32 23,57 0,44 -23,57 -18,32 -36,13 -11,10" fill="#fffbeb" stroke="#fef08a" stroke-width="1.5"/>

    <!-- Starburst Flares around medal -->
    <path d="M 0,-70 L 0,-85 M 0,100 L 0,115 M -85,15 L -100,15 M 85,15 L 100,15" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="15" r="10" fill="#b45309" opacity="0.3"/>
  </g>

  <!-- Sparkling Golden Stars in Background -->
  <g fill="#fde047">
    <path d="M 440,60 Q 440,75 455,75 Q 440,75 440,90 Q 440,75 425,75 Q 440,75 440,60 Z"/>
    <path d="M 330,220 Q 330,230 340,230 Q 330,230 330,240 Q 330,230 320,230 Q 330,230 330,220 Z"/>
    <path d="M 120,40 Q 120,50 130,50 Q 120,50 120,60 Q 120,50 110,50 Q 120,50 120,40 Z"/>
  </g>
</svg>